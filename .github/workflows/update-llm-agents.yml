name: Update LLM agents

on:
  schedule:
    # Follow upstream's four daily checks offset by 30 minutes
    - cron: "30 0,4,18,21 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Update agent inputs
        run: nix flake update llm-agents
      - name: Update T3 Code release snapshot
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          snapshot="$(mktemp pkgs/t3code-release.XXXXXX)"
          trap 'rm -f "$snapshot"' EXIT
          gh api repos/pingdotgg/t3code/releases/latest | jq -e '
              . as $release
              | (.tag_name | ltrimstr("v")) as $version
              | [["t3-\($version)-darwin-arm64.tar.gz"],
                 ["t3-\($version)-linux-arm64.tar.gz"],
                 ["t3-\($version)-linux-x64.tar.gz"],
                 ["T3-Code-\($version)-arm64.zip"],
                 ["T3-Code-arm64.AppImage", "T3-Code-\($version)-arm64.AppImage"],
                 ["T3-Code-x86_64.AppImage", "T3-Code-\($version)-x86_64.AppImage"]] as $required
              | {tag_name, assets: ([
                  $required[] as $names
                  | (first($names[] as $name | $release.assets[] | select(.name == $name))
                     // error("Missing T3 Code asset: \($names | join(" or "))"))
                  | if (.digest // "" | test("^sha256:[0-9a-f]{64}$"))
                    then {name, browser_download_url, digest}
                    else error("Missing or invalid SHA-256 for \(.name)") end
                ] | sort_by(.name))}
          ' > "$snapshot"
          mv "$snapshot" pkgs/t3code-release.json
      - name: Sync Pi changelog version
        run: |
          version="$(nix eval --raw --impure --expr '(builtins.getFlake (toString ./.)).inputs."llm-agents".packages."x86_64-linux".pi.version')"
          jq --arg version "$version" '.lastChangelogVersion = $version' pi/agent/settings.json > settings.json
          mv settings.json pi/agent/settings.json
      - name: Validate flake
        run: nix flake check --accept-flake-config
      - name: Commit update
        run: |
          if git diff --quiet -- flake.lock pi/agent/settings.json pkgs/t3code-release.json; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.lock pi/agent/settings.json pkgs/t3code-release.json
          git commit -m "chore: update LLM agents"
          git push
